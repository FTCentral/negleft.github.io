{{ define "main" }}
<main>
    <article>
        <header class="relative isolate overflow-hidden border-b border-white/5">
            <div class="absolute inset-0 -z-10 bg-green-radial"></div>
            <div class="absolute inset-x-0 bottom-0 -z-10 h-px bg-gradient-to-r from-transparent via-primary-500/40 to-transparent"></div>
            <div class="mx-auto max-w-7xl px-4 pb-16 pt-20 text-center sm:px-6 lg:px-8 lg:pb-20 lg:pt-28">
                <h1 class="font-display text-5xl font-bold capitalize tracking-tight text-white glow-text sm:text-6xl">
                    {{ .Title }}
                </h1>
                {{ with .Content }}
                <div class="prose prose-invert mx-auto mt-6 max-w-2xl text-left">
                    {{- . -}}
                </div>
                {{ end }}
            </div>
        </header>

        {{ partial "posts-template.html" . }}
    </article>
    <div class="mx-auto max-w-3xl px-4 py-16">
        {{ partial "pagination" . }}
    </div>
</main>
{{ end }}
