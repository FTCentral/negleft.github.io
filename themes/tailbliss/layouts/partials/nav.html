<header class="sticky top-0 z-50 w-full border-b border-white/5 bg-black/80 backdrop-blur-xl">
    <div x-data="{ open: false }"
         class="mx-auto flex max-w-7xl flex-col px-4 sm:px-6 md:flex-row md:items-center md:justify-between lg:px-8">
        <div class="flex flex-row items-center justify-between py-3">
            <a href="/" class="group flex items-center gap-3">
                <img src="/images/site-logo.svg"
                     width="48" height="48"
                     class="logo-glow h-12 w-12"
                     alt="{{ .Site.Title }} Logo" />
                <span class="font-display text-lg font-bold uppercase tracking-[0.25em] text-white transition-colors duration-300 group-hover:text-primary-300">
                    {{ .Site.Title }}
                </span>
            </a>
            <button class="rounded-lg border border-white/10 p-2 text-zinc-300 transition hover:border-primary-500/40 hover:text-primary-300 focus:outline-none md:hidden"
                    @click="open = !open" role="navigation" aria-expanded="false" aria-label="Main" aria-controls="menuItems">
                <svg fill="currentColor" viewBox="0 0 20 20" class="h-6 w-6">
                    <path x-show="!open" fill-rule="evenodd"
                          d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM9 15a1 1 0 011-1h6a1 1 0 110 2h-6a1 1 0 01-1-1z"
                          clip-rule="evenodd"></path>
                    <path x-show="open" fill-rule="evenodd"
                          d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                          clip-rule="evenodd"></path>
                </svg>
            </button>
        </div>
        <nav id="menuItems"
             :class="{'flex': open, 'hidden': !open}"
             class="hidden flex-grow flex-col border-t border-white/5 pb-4 md:flex md:flex-row md:items-center md:justify-end md:border-0 md:pb-0">
            {{ range site.Menus.main }}
            {{ $active := or (eq (.URL | relURL) $.RelPermalink) ($.IsMenuCurrent "main" .) }}
            <a class="group relative px-4 py-3 text-sm font-semibold uppercase tracking-wider transition-colors duration-200 md:py-2 {{ if $active }}text-primary-300{{ else }}text-zinc-400 hover:text-white{{ end }}"
               href="{{ .URL | absLangURL }}" title="{{ .Title | default .Name }}"
               {{ if $active }}aria-current="page"{{ end }}>
                {{ .Name }}
                <span class="absolute inset-x-4 bottom-0 h-px origin-left bg-primary-400 transition-transform duration-300 {{ if $active }}scale-x-100{{ else }}scale-x-0 group-hover:scale-x-100{{ end }}"></span>
            </a>
            {{ end }}
        </nav>
    </div>
</header>
