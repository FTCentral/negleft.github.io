{{ with .Params.timage }}
{{ with resources.Get . }}
{{ $banner := .Resize "1800x webp q80" }}
<img src="{{ $banner.RelPermalink | replaceRE `/\.\./assets/` `/assets/` }}"
     width="{{ $banner.Width }}" height="{{ $banner.Height }}"
     alt="" aria-hidden="true" decoding="async"
     class="absolute inset-0 -z-20 h-full w-full object-cover opacity-40">
{{ end }}
{{ end }}

<div class="absolute inset-0 -z-10 bg-gradient-to-t from-black via-black/80 to-black/40"></div>
<div class="absolute inset-0 -z-10 bg-[radial-gradient(60%_50%_at_50%_120%,rgba(22,212,107,0.22)_0%,rgba(0,0,0,0)_70%)]"></div>
