{{ define "main"}}
<main id="main" class="relative isolate flex min-h-[70vh] items-center overflow-hidden">
    <div class="absolute inset-0 -z-10 bg-green-radial"></div>
    <div class="mx-auto w-full max-w-3xl px-4 py-20 text-center sm:px-6 lg:px-8">
        <p class="eyebrow">Error 404</p>
        <h1 class="mt-6 font-display text-8xl font-bold tracking-tight text-white glow-text sm:text-9xl">
            404
        </h1>
        <p class="mt-6 font-display text-3xl font-bold tracking-tight text-white sm:text-4xl">
            #GoodByeCruelWorld
        </p>
        <p class="mt-4 text-lg font-light text-zinc-400">
            This page is dead.
        </p>
        <a href="/" class="btn-primary mt-10">
            Respawn?
            <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14m-6-6 6 6-6 6" />
            </svg>
        </a>
    </div>
</main>
{{ end }}
